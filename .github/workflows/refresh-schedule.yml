name: Daily schedule refresh

# Refreshes the sub/dub data that powers /api/schedule by POSTing to the
# in-process admin endpoint on the live Flask app:
#   POST https://bingery.fly.dev/api/admin/sync-dub-sources
#       Header: X-Admin-Secret: <ADMIN_SYNC_SECRET>
#
# This runs the syncs inside the already-loaded gunicorn worker, so we
# avoid spawning a second Python process that would OOM on Fly's 256MB
# free tier. Memory peak is ~25MB on top of the running worker — fits.
#
# Required secrets:
#   GitHub: ADMIN_SYNC_SECRET  (sent in the request header)
#   Fly:    ADMIN_SYNC_SECRET  (matched server-side; same value)
#   Fly:    ANIMESCHEDULE_API_KEY  (used by the AnimeSchedule sync)
#
# After the sync, the `audit` job verifies the schedule the app now serves
# against independent sources (AniList, MAL/Jikan, AnimeSchedule, CR RSS)
# via POST /api/admin/audit-schedule. The audit is strictly READ-ONLY —
# the cron reports and alarms; it never corrects data. Thresholds
# (documented in docs/runbooks/schedule-audit.md): >5 MISMATCH entries,
# >60% synthetic dub fraction, or any evidence-backed leak fails the job
# and opens/updates a `schedule-audit` issue.
#
# The synthetic-fraction axis carries two-voice discipline: the fraction is
# only a proxy for "the real dub tiers went dark", so it alarms only when
# the tier health in the same report agrees (or above a hard 85% ceiling).
# The Sunday seasonal pull below ingests a batch the seeder projects onto
# before AnimeSchedule/Crunchyroll can upgrade it, which spiked the fraction
# to 56-67% every Sunday against a 60% line — a coin-flip alarm that fired
# on 2026-07-19, -07-26 and -08-02 while all four real tiers reported live.

on:
  schedule:
    # 06:00 UTC daily (~02:00 EDT / 23:00 PDT — off-peak everywhere).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: bingery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://bingery.fly.dev
    steps:
      - name: Wake the Fly machine
        # Hit a public endpoint so Fly auto-starts the machine if it's
        # been idle. Retries a few times — first request after sleep can
        # be a few seconds slow.
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$APP_URL/api/health" > /dev/null; then
              echo "machine is up"; exit 0
            fi
            echo "attempt $i: not up yet, sleeping"
            sleep 5
          done
          echo "machine never woke"; exit 1

      - name: Refresh AniList statuses (schedule-window anti-drift)
        id: window
        # Resyncs every show (any stored status) with an episode near
        # today. Finished shows drop out of AniList's airing feed, so ONLY
        # this cohort-by-our-own-rows refresh can flip them to Finished —
        # this step is what keeps ghost shows from ever rebuilding.
        # Failure is loud but must not block the dub sync below.
        continue-on-error: true
        run: |
          curl --fail-with-body --max-time 600 \
            --output anilist-refresh.json \
            -X POST \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"mode": "window"}' \
            "$APP_URL/api/anilist/sync" \
            || { echo "::warning::AniList window refresh failed — statuses may drift until the next run"; exit 1; }
          echo
          jq -e 'select(.mode == "window" and
                   ([.requested, .synced, .failed] | all(type == "number" and . >= 0)) and
                   (.requested == .synced + .failed))
                 | {cohort, requested, synced, failed, capped}' anilist-refresh.json
          if jq -e '.failed > 0' anilist-refresh.json >/dev/null; then
            jq -r '"::warning::AniList window refresh failed for \(.failed) of \(.requested) titles."' anilist-refresh.json
          fi
          # A quiet week is valid. A nonempty cohort with no successful updates is a failure.
          jq -e '.requested == 0 or .synced > 0' anilist-refresh.json >/dev/null

      - name: Weekly seasonal catalog pull (Sundays)
        id: seasonal
        # Replaces the retired Render weekly resync: keeps new-season
        # titles flowing into the catalog. Skips silently on other days.
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "not Sunday (UTC) — skipping seasonal pull"; exit 0
          fi
          month=$(date -u +%m); year=$(date -u +%Y)
          case $month in
            01|02|03) season=WINTER ;;
            04|05|06) season=SPRING ;;
            07|08|09) season=SUMMER ;;
            *)        season=FALL ;;
          esac
          curl --fail-with-body --max-time 600 \
            --output seasonal-result.json \
            -X POST \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"mode\": \"seasonal\", \"season\": \"$season\", \"year\": $year, \"pages\": 2}" \
            "$APP_URL/api/anilist/sync" \
            || { echo "::warning::seasonal catalog pull failed"; exit 1; }
          jq -e 'select(.mode == "seasonal" and (.synced | type == "number" and . > 0))
                 | {mode, synced}' seasonal-result.json \
            || { echo "::warning::Seasonal pull returned no synced titles or an invalid response"; exit 1; }

      - name: Run syncs via admin endpoint
        id: dub
        # max-time 600 = 10 min cap. Typical run is ~60-90s
        # (CR ~10s, AS ~30-60s, seed ~5s).
        run: |
          curl --fail-with-body --max-time 600 \
            --output sync-result.json \
            -X POST \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/admin/sync-dub-sources"
          echo
          echo "=== Snapshot ==="
          jq -e '.snapshot | select(.total_dub_eps | type == "number")' sync-result.json
          echo
          echo "=== Dub tier doctor ==="
          jq '.dub_doctor // "doctor unavailable"' sync-result.json
          # Dark tiers show up here loudly (e.g. a missing/expired
          # ANIMESCHEDULE_API_KEY); the audit job below turns sustained
          # problems into a failed run + issue.
          jq -r '.dub_doctor.alarms[]? | "::warning::dub tier alarm: \(.)"' sync-result.json
          # The endpoint reports provider failures inside a successful HTTP response.
          # A source with zero matches is still a completed run.
          failed_stages=$(jq -re '[
            (if (.crunchyroll.written | type) != "number" then "Crunchyroll" else empty end),
            (if (.animeschedule.written | type) != "number" then "AnimeSchedule" else empty end),
            (if .seed.exit_code != 0 then "Dub projections" else empty end)
          ]' sync-result.json)
          jq -r '.[] | "::warning::Dub refresh stage failed: \(.)"' <<< "$failed_stages"
          if jq -e 'length > 0' <<< "$failed_stages" >/dev/null; then
            jq -r '"Dub refresh stages that failed: " + join(", ")' <<< "$failed_stages" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -e 'length < 3' <<< "$failed_stages" >/dev/null

      - name: Report refresh failures
        if: ${{ !cancelled() && (steps.window.outcome == 'failure' || steps.seasonal.outcome == 'failure' || steps.dub.outcome == 'failure') }}
        run: |
          {
            echo "### Schedule refresh failed"
            echo "Window refresh: ${{ steps.window.outcome }}. Seasonal step: ${{ steps.seasonal.outcome }}. Dub sync: ${{ steps.dub.outcome }}."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  audit:
    # Verifies what the schedule now serves against independent sources.
    # Report-only: uploads the audit as an artifact and alarms on
    # thresholds. NO correction path runs unattended.
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      APP_URL: https://bingery.fly.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wake the Fly machine
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$APP_URL/api/health" > /dev/null; then
              echo "machine is up"; exit 0
            fi
            echo "attempt $i: not up yet, sleeping"
            sleep 5
          done
          echo "machine never woke"; exit 1

      - name: Run schedule audit via admin endpoint
        # weeks=1 + max_anime=80 keeps the in-request runtime ~2-3 min
        # (source calls are rate-limited server-side). Deeper windows are
        # for attended CLI runs (python audit_schedule.py --weeks 3).
        run: |
          curl --fail-with-body --max-time 600 \
            --output audit-report.json \
            -X POST \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"weeks": 1, "max_anime": 80}' \
            "$APP_URL/api/admin/audit-schedule"
          echo
          echo "=== Audit totals ==="
          jq -e 'select((.threshold_breaches | type == "array")
                     and (.tiers | type == "array")
                     and (.totals.sub.entries | type == "number")
                     and (.totals.dub.entries | type == "number"))
                 | .totals' audit-report.json
          echo "=== Source tiers ==="
          jq '[.tiers[] | {name, state, detail}]' audit-report.json
          {
            echo '### Schedule audit coverage'
            echo '| Track | Entries | Confirmed | Estimated | Mismatch | Unverifiable |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: |'
            jq -r '.totals | ("sub", "dub") as $track | .[$track]
                   | "| \($track) | \(.entries) | \(.confirmed) | \(.estimated) | \(.mismatch) | \(.unverifiable) |"' audit-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-audit-${{ github.run_id }}
          path: audit-report.json
          retention-days: 90

      - name: Evaluate thresholds (report-only gate)
        run: |
          breaches=$(jq -r '.threshold_breaches[]?' audit-report.json)
          if [ -z "$breaches" ]; then
            echo "No audit thresholds exceeded. See the run summary for verification coverage."
            exit 0
          fi
          echo "$breaches" | while read -r b; do
            echo "::error::schedule audit breach: $b"
          done
          totals=$(jq -c '.totals' audit-report.json)
          body=$(printf 'Daily schedule audit crossed alert thresholds.\n\nBreaches:\n%s\n\nTotals: `%s`\n\nRun: %s\n\nThresholds and remediation: docs/runbooks/schedule-audit.md. Corrections are attended-only — do not automate a fix from this issue.\n' \
            "$(echo "$breaches" | sed 's/^/- /')" "$totals" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          # The label IS the dedup key, so it has to exist before we rely on
          # it. It never did: `gh issue create --label schedule-audit` failed,
          # the old `||` fallback quietly created an UNLABELED issue, and the
          # next breach's label lookup found nothing — so every breach opened
          # a fresh duplicate (#17, #18, #19) instead of commenting on one.
          gh label create schedule-audit \
            --repo "${{ github.repository }}" \
            --color d73a4a \
            --description "Daily schedule audit crossed an alert threshold" \
            >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --label schedule-audit --state open --json number --jq '.[0].number')
          # Fall back to a title match so an unlabeled issue left by the old
          # bug is adopted and relabeled rather than duplicated again.
          if [ -z "$existing" ]; then
            existing=$(gh issue list --repo "${{ github.repository }}" \
              --state open --search 'in:title "Schedule audit: threshold breach"' \
              --json number --jq '.[0].number')
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" \
              --add-label schedule-audit >/dev/null 2>&1 || true
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Schedule audit: threshold breach" \
              --label schedule-audit --body "$body" \
              || gh issue create --repo "${{ github.repository }}" \
                   --title "Schedule audit: threshold breach" --body "$body"
          fi
          exit 1
