name: CI

# Gates pushes and PRs on the test suites that already exist in the repo.
# Until this file landed, `refresh-schedule.yml` was the ONLY workflow — the
# 577-test backend suite and the 28-file frontend suite never ran in CI, so
# nothing caught a regression before it reached main or Fly.
#
# No secrets are required. tests/conftest.py forces an in-memory SQLite DB and
# defaults every env var it needs, so the backend suite is hermetic — verified
# by running it with .env absent and the API keys unset.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run obsolete. The daily
# refresh uses its own group, so this never contends with it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile runtime (python:3.13-slim).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: node >=20.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test:run

      - name: Type-check and build
        # `npm run build` is `tsc -b && vite build`, so this covers the
        # type-check gate too — a broken type never reaches Pages.
        run: npm run build
